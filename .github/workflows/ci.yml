name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Lint Python if exists
        run: |
          if find . -name "*.py" -print -quit | grep -q .; then
            python -m pip install --upgrade pip ruff
            ruff check .
          else
            echo "No Python files, skip ruff."
          fi
